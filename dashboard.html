<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Style Me</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <script>
        // Not logged in? Go back to the login page straight away.
        if (!localStorage.getItem('user_token')) window.location.replace('index.html');
    </script>
</head>
<body>

    <div class="backdrop" id="backdrop"></div>

    <main class="dashboard">

        <header class="header">
            <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu">
                Dashboard
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
            </button>

            <nav class="menu" id="menu" aria-label="Main menu">
                <a href="dashboard.html" class="current" aria-current="page">Dashboard</a>
                <a href="wardrobe.html">My Wardrobe</a>
                <a href="weather-outfit.html">Generate Weather Based Outfit</a>
                <a href="generate-outfit.html">Generate Outfit</a>
                <a href="style-me.html">Style Me</a>
                <a href="saved-outfits.html">Saved Outfits</a>
                <button class="menu-close" id="menuClose" aria-label="Close menu">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>
                </button>
            </nav>

            <a class="settings-btn" href="settings.html" aria-label="Settings">&#9881;&#xFE0E;</a>
        </header>

        <section class="tiles">
            <a class="tile" href="wardrobe.html">
                <img class="tile-icon" src="assets/wardrobe.png" alt="" aria-hidden="true">
                My Wardrobe
            </a>

            <a class="tile tile-weather" id="wxTile" href="weather-outfit.html" data-theme="cloud">
                <span class="tile-icon" id="wxIcon" aria-hidden="true">&#9729;&#65039;</span>
                <span class="wx-temp" id="wxTemp">--</span>
                <span>Generate weather based outfit<span class="wx-desc" id="wxDesc">Getting weather...</span></span>
            </a>

            <a class="tile" href="generate-outfit.html">
                <img class="tile-icon" src="assets/generate-outfit.png" alt="" aria-hidden="true">
                Generate Outfit
            </a>

            <a class="tile" href="style-me.html">
                <img class="tile-icon" src="assets/style-me.png" alt="" aria-hidden="true">
                Style Me
            </a>
        </section>

        <section class="carousel" aria-label="Saved outfits">
            <div class="stage">
                <div class="stack" id="stack"></div>
                <a class="stack-caption" href="saved-outfits.html">Saved Outfits</a>
            </div>
            <div class="dots" id="dots"></div>
        </section>

    </main>

    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Outfit preview" hidden>
        <button class="viewer-close" id="viewerClose" aria-label="Close">&times;</button>
        <img id="viewerImg" alt="">
        <span class="viewer-placeholder" id="viewerPh" aria-hidden="true">&#128087;</span>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';   // same address as on the login/sign up pages

        // ----- Check the login token is still valid -----
        fetch(`${API_BASE}/api/me`, { headers: { Authorization: 'Bearer ' + localStorage.getItem('user_token') } })
            .then(res => {
                if (res.status === 401) {
                    localStorage.removeItem('user_token');
                    window.location.replace('index.html');
                }
            })
            .catch(() => { /* backend offline: stay on the page */ });

        // ----- Menu overlay -----
        const menuBtn = document.getElementById('menuBtn');
        const menu = document.getElementById('menu');
        const backdrop = document.getElementById('backdrop');

        function setMenu(open) {
            menu.classList.toggle('open', open);
            backdrop.classList.toggle('open', open);
            menuBtn.setAttribute('aria-expanded', String(open));
            if (open) menu.querySelector('a').focus(); else menuBtn.focus();
        }
        menuBtn.addEventListener('click', () => setMenu(true));
        document.getElementById('menuClose').addEventListener('click', () => setMenu(false));
        backdrop.addEventListener('click', () => setMenu(false));
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!viewer.hidden) closeViewer();
            else if (menu.classList.contains('open')) setMenu(false);
        });

        // ----- Live weather (Open-Meteo: free, no API key) -----
        const wxTile = document.getElementById('wxTile');
        const wxIcon = document.getElementById('wxIcon');
        const wxTemp = document.getElementById('wxTemp');
        const wxDesc = document.getElementById('wxDesc');
        let weatherReady = false;

        // Turns Open-Meteo's weather code into an icon, a label and a tile colour
        function describeWeather(code, isDay) {
            if (code === 0) return isDay ? { icon: '☀️', label: 'Clear', theme: 'clear' } : { icon: '🌙', label: 'Clear night', theme: 'night' };
            if (code <= 2)  return isDay ? { icon: '⛅', label: 'Partly cloudy', theme: 'cloud' } : { icon: '☁️', label: 'Partly cloudy', theme: 'night' };
            if (code === 3) return { icon: '☁️', label: 'Overcast', theme: 'cloud' };
            if (code === 45 || code === 48) return { icon: '🌫️', label: 'Foggy', theme: 'fog' };
            if (code >= 51 && code <= 57) return { icon: '🌦️', label: 'Drizzle', theme: 'rain' };
            if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return { icon: '🌧️', label: 'Rain', theme: 'rain' };
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) return { icon: '❄️', label: 'Snow', theme: 'snow' };
            if (code >= 95) return { icon: '⛈️', label: 'Thunderstorm', theme: 'storm' };
            return { icon: '☁️', label: 'Cloudy', theme: 'cloud' };
        }

        function showWeatherProblem(message) {
            weatherReady = false;
            wxTemp.textContent = '--';
            wxDesc.textContent = message;
        }

        function loadWeather() {
            wxDesc.textContent = 'Getting weather...';
            if (!navigator.geolocation) return showWeatherProblem('Location not supported');

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const { latitude, longitude } = pos.coords;
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,is_day&timezone=auto`;
                    const data = await (await fetch(url)).json();
                    const c = data.current;
                    const info = describeWeather(c.weather_code, c.is_day === 1);
                    const temp = Math.round(c.temperature_2m);

                    wxIcon.textContent = info.icon;
                    wxTemp.textContent = temp + '°C';
                    wxDesc.textContent = info.label;
                    wxTile.dataset.theme = info.theme;
                    weatherReady = true;

                    // The weather outfit page can read this later
                    sessionStorage.setItem('styleme_weather', JSON.stringify({ temp, code: c.weather_code, label: info.label }));
                } catch (err) {
                    showWeatherProblem('Weather unavailable. Tap to retry');
                }
            }, () => showWeatherProblem('Tap to allow location'), { timeout: 10000, maximumAge: 600000 });
        }

        // If there is no weather yet, tapping the tile retries instead of leaving the page
        wxTile.addEventListener('click', (e) => { if (!weatherReady) { e.preventDefault(); loadWeather(); } });
        loadWeather();

        // ----- Saved outfits: stacked cards -----
        // Sample entries so you can see it working. Delete them once outfits come from the backend.
        // Real entries will look like: { id: 1, image: 'path/to/photo.jpg' }
        let savedOutfits = [
            { id: 1, image: '' },
            { id: 2, image: '' },
            { id: 3, image: '' }
        ];
        if (savedOutfits.length === 0) savedOutfits = [{ empty: true, image: '' }];

        const stack = document.getElementById('stack');
        const dotsBox = document.getElementById('dots');
        const cards = [];
        let current = 0;

        savedOutfits.forEach((outfit, i) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'card';
            card.dataset.index = i;
            card.setAttribute('aria-label', outfit.empty ? 'No saved outfits yet. Create one' : 'Open outfit ' + (i + 1));
            if (outfit.image) {
                const img = document.createElement('img');
                img.src = outfit.image;
                img.alt = '';
                img.draggable = false;
                card.appendChild(img);
            } else {
                const ph = document.createElement('span');
                ph.className = 'card-placeholder';
                ph.textContent = '👗';
                card.appendChild(ph);
            }
            stack.appendChild(card);
            cards.push(card);
        });

        // Puts every card in the right place: front, behind, far behind, or swiped away
        function render() {
            cards.forEach((card, i) => {
                const offset = i - current;
                card.dataset.pos = offset < 0 ? 'gone' : offset === 0 ? 'front' : offset <= 2 ? 'behind' : 'far';
                card.style.setProperty('--o', Math.min(Math.max(offset, 0), 3));
                card.style.zIndex = 10 - Math.abs(offset);
                card.tabIndex = offset === 0 ? 0 : -1;
            });
            [...dotsBox.children].forEach((d, i) => d.classList.toggle('active', i === current));
        }

        function go(i) {
            current = Math.max(0, Math.min(cards.length - 1, i));
            render();
        }

        if (cards.length > 1) {
            cards.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.className = 'dot';
                dot.setAttribute('aria-label', 'Show outfit ' + (i + 1));
                dot.addEventListener('click', () => go(i));
                dotsBox.appendChild(dot);
            });
        }
        render();

        // Swipe left/right to change card, tap the front card to open it, tap a card behind to bring it forward
        let startX = null;
        stack.addEventListener('pointerdown', (e) => { startX = e.clientX; });
        stack.addEventListener('pointercancel', () => { startX = null; });
        stack.addEventListener('pointerup', (e) => {
            if (startX === null) return;
            const dx = e.clientX - startX;
            startX = null;
            if (dx < -40) return go(current + 1);
            if (dx > 40) return go(current - 1);
            const card = e.target.closest('.card');
            if (!card) return;
            const index = Number(card.dataset.index);
            if (index === current) openFront(); else go(index);
        });
        // Keyboard: Enter/Space on the front card (a keyboard click has detail 0), arrow keys to move
        stack.addEventListener('click', (e) => { if (e.detail === 0 && e.target.closest('.card')?.dataset.pos === 'front') openFront(); });
        stack.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') go(current + 1);
            if (e.key === 'ArrowLeft') go(current - 1);
        });

        // ----- Fullscreen viewer -----
        const viewer = document.getElementById('viewer');
        const viewerImg = document.getElementById('viewerImg');
        const viewerPh = document.getElementById('viewerPh');

        function openFront() {
            const outfit = savedOutfits[current];
            if (outfit.empty) { window.location.href = 'generate-outfit.html'; return; }
            viewerImg.hidden = !outfit.image;
            viewerPh.hidden = !!outfit.image;
            if (outfit.image) { viewerImg.src = outfit.image; viewerImg.alt = 'Saved outfit'; }
            viewer.hidden = false;
            document.body.style.overflow = 'hidden';
            document.getElementById('viewerClose').focus();
        }
        function closeViewer() {
            viewer.hidden = true;
            viewerImg.removeAttribute('src');
            document.body.style.overflow = '';
        }
        viewer.addEventListener('click', closeViewer);
    </script>
</body>
</html>
